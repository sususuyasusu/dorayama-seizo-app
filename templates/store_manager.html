<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>経常利益｜門仲どらやき どら山</title>
<style>
:root{--ink:#28231e;--sub:#756b60;--paper:#f6f1e8;--card:#fffdfa;--line:#ded3c5;--red:#853b36;--gold:#a27a3e;--green:#3f7258;--blue:#315f78;--soft-red:#fbefec;--soft-gold:#fbf4e5;--soft-blue:#edf4f7}
.audit{margin-top:14px}.audit-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.audit-total{padding:12px;border-radius:10px;background:#edf4f7;color:#315f78;margin-bottom:8px}.audit-row{display:grid;grid-template-columns:1fr 80px 90px;gap:8px;padding:8px 3px;border-bottom:1px solid #eee7dd;font-size:11px}.audit-row strong{text-align:right}.pending-row{padding:9px 3px;border-bottom:1px solid #eee7dd;font-size:11px}.pending-row b{color:var(--red);display:block;margin-bottom:3px}@media(max-width:980px){.audit-grid{grid-template-columns:1fr}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-variant-numeric:tabular-nums}.top{height:72px;display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.top img{width:62px;height:48px;object-fit:contain}.top h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;letter-spacing:.06em}.back{margin-left:auto;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:#fff;font-weight:700;font-size:13px}.page{max-width:1320px;margin:auto;padding:24px 28px 40px}.headline{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}.headline h2{margin:0 0 5px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:28px}.meta{color:var(--sub);font-size:12px}.status{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:var(--soft-gold);color:#76561f;font-weight:700}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#c08b32}.decision{display:grid;grid-template-columns:1.15fr repeat(3,1fr);border:1px solid #d9c6b8;border-left:5px solid var(--red);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 8px 28px rgba(63,48,30,.06)}.decision-title{padding:20px;background:#f3e9df}.decision-title small{display:block;color:var(--red);font-weight:800;letter-spacing:.08em}.decision-title strong{display:block;margin-top:8px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:23px}.decision-item{padding:18px;border-left:1px solid #eadfd4}.decision-item span{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;background:var(--soft-gold);color:#775721}.decision-item.urgent span{background:var(--soft-red);color:var(--red)}.decision-item.normal span{background:#e9f2ed;color:var(--green)}.decision-item b{display:block;margin:8px 0 5px;font-size:14px}.decision-item p{margin:0;color:var(--sub);font-size:11px;line-height:1.65}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.kpi{padding:17px;background:var(--card);border:1px solid var(--line);border-radius:13px;min-width:0}.kpi .label{color:var(--sub);font-size:11px;font-weight:700}.kpi strong{display:block;margin:9px 0 3px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px}.kpi small{color:var(--sub);font-size:10px}.kpi.loss{border-top:4px solid var(--red);padding-top:14px}.kpi .bar{height:5px;margin-top:10px;border-radius:4px;background:#ebe4db;overflow:hidden}.kpi .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}.panel h3{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.legend{display:flex;gap:12px;color:var(--sub);font-size:10px}.legend i{display:inline-block;width:14px;height:3px;margin-right:4px;vertical-align:3px;background:var(--ink)}.legend .budget{background:var(--gold)}.legend .be{background:var(--red)}#trend{width:100%;height:255px;display:block}.axis{stroke:#e3dbd0;stroke-width:1}.actual{fill:none;stroke:#30383e;stroke-width:3}.budget-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 5}.be-line{fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:3 5}.dot-actual{fill:#30383e}.chart-label{fill:#857b70;font-size:10px}.profit-row{display:grid;grid-template-columns:34px 1fr 74px;gap:8px;align-items:center;margin:9px 0;font-size:10px}.profit-track{height:11px;border-radius:8px;background:#eee8df;position:relative;overflow:hidden}.profit-track i{position:absolute;top:0;height:100%;background:#9f4a42}.profit-track i.plus{background:#4e7a61}.profit-row strong{text-align:right}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.checks{width:100%;border-collapse:collapse;min-width:820px}.checks th{padding:10px 12px;text-align:left;background:#f1ebe2;color:var(--sub);font-size:10px}.checks td{padding:11px 12px;border-top:1px solid #ebe3d9;font-size:11px;line-height:1.45}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-weight:800;background:var(--soft-red);color:var(--red)}.badge.tmp{background:var(--soft-gold);color:#795b22}.next{color:var(--blue);font-weight:700}.bottom{margin-top:14px}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rule{padding:10px 12px;border-radius:9px;background:#f7f2ea;color:#665d53;font-size:10px;line-height:1.5}.notice{margin-top:12px;color:var(--sub);font-size:10px;line-height:1.6}@media(max-width:980px){.decision{grid-template-columns:1fr 1fr}.decision-title{grid-column:1/-1}.decision-item:nth-child(2){border-left:0}.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:680px){.top{height:62px;padding:0 14px}.top img{width:48px}.top h1{font-size:16px}.page{padding:16px 12px 30px}.headline{align-items:flex-start;flex-direction:column}.headline h2{font-size:23px}.decision{grid-template-columns:1fr}.decision-title{grid-column:auto}.decision-item{border-left:0;border-top:1px solid #eadfd4}.kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:21px}.rules{grid-template-columns:1fr}.legend{display:none}}
</style>
</head>
<body>
<header class="top"><img src="/static/logo.png" alt="どら山"><h1>経常利益</h1><a class="back" href="/">製造アプリへ戻る</a></header>
<main class="page" id="app"><div class="panel">経営数字を読み込み中…</div></main>
<script>
const yen=n=>n==null?'未確定':(n<0?'▲':n>0?'＋':'')+Math.abs(n/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万円';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linePoints(rows,key,max,w,h,p){return rows.map((r,i)=>(p+i*(w-p*2)/(rows.length-1))+','+(h-p-r[key]/max*(h-p*2))).join(' ')}
function renderChart(rows){const w=620,h=250,p=34,max=Math.max(...rows.flatMap(r=>[r.sales,r.budget,r.breakEven]),1)*1.08;let grid='';for(let i=0;i<4;i++){const y=p+i*(h-p*2)/3;grid+='<line class="axis" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/><text class="chart-label" x="0" y="'+(y+3)+'">'+Math.round((max*(3-i)/3)/10000)+'万</text>'}const labels=rows.map((r,i)=>'<text class="chart-label" text-anchor="middle" x="'+(p+i*(w-p*2)/(rows.length-1))+'" y="242">'+safe(r.month)+'</text>').join('');const dots=rows.map((r,i)=>'<circle class="dot-actual" cx="'+(p+i*(w-p*2)/(rows.length-1))+'" cy="'+(h-p-r.sales/max*(h-p*2))+'" r="4"/>').join('');return '<svg id="trend" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="月次の予算、実績、損益分岐点の折れ線グラフ">'+grid+'<polyline class="budget-line" points="'+linePoints(rows,'budget',max,w,h,p)+'"/><polyline class="be-line" points="'+linePoints(rows,'breakEven',max,w,h,p)+'"/><polyline class="actual" points="'+linePoints(rows,'sales',max,w,h,p)+'"/>'+dots+labels+'</svg>'}
function render(d){const x=d.latest||{},dec=(d.todayDecisions||[]).map((v,i)=>'<div class="decision-item '+safe(v.level)+'"><span>'+(i===0?'最優先':i===1?'要確認':'運営基準')+'</span><b>'+safe(v.title)+'</b><p>'+safe(v.detail)+'</p></div>').join('');const checks=(d.checks||[]).map(v=>'<tr><td><b>'+safe(v.category)+'</b><br><small>'+safe(v.source)+'</small></td><td><span class="badge '+(v.status==='暫定'?'tmp':'')+'">'+safe(v.status)+'</span></td><td>'+safe(v.reason)+'</td><td>'+safe(v.owner)+'</td><td class="next">'+safe(v.next)+'</td></tr>').join('');const maxProfit=Math.max(...(d.months||[]).map(v=>Math.abs(v.profit)),1);const profits=(d.months||[]).map(v=>'<div class="profit-row"><b>'+safe(v.month)+'</b><div class="profit-track"><i class="'+(v.profit>=0?'plus':'')+'" style="left:'+(v.profit>=0?50:50-Math.abs(v.profit)/maxProfit*50)+'%;width:'+Math.abs(v.profit)/maxProfit*50+'%"></i></div><strong>'+yen(v.profit)+'</strong></div>').join('');const rules=(d.assumptions||[]).map(v=>'<div class="rule">'+safe(v)+'</div>').join('');document.getElementById('app').innerHTML='<div class="headline"><div><h2>予算・実績から、経常利益と今日の判断をつかむ</h2><div class="meta">表示対象 '+safe(d.period)+' ／ '+safe(d.asOf)+'時点</div></div><div class="status">'+safe(d.statusLabel)+'</div></div><section class="decision"><div class="decision-title"><small>TODAY’S DECISION</small><strong>今日、店長が確認すること</strong></div>'+dec+'</section><section class="kpis"><div class="kpi"><div class="label">実績売上</div><strong>'+yen(x.sales)+'</strong><small>確定済み・確認済みの範囲</small></div><div class="kpi"><div class="label">予算売上</div><strong>'+yen(x.budget)+'</strong><small>達成率 '+safe(d.achievement)+'%</small><div class="bar"><i style="width:'+Math.min(d.achievement||0,100)+'%"></i></div></div><div class="kpi"><div class="label">損益分岐点</div><strong>'+yen(x.breakEven)+'</strong><small>到達率 '+safe(d.breakEvenRate)+'% ／ あと '+yen(d.breakEvenGap).replace('＋','')+'</small></div><div class="kpi loss"><div class="label">経常利益</div><strong>'+yen(x.profit)+'</strong><small>共通費配賦後・暫定</small></div><div class="kpi"><div class="label">累積経常利益</div><strong>'+yen(x.cumulative)+'</strong><small>1月から表示月まで</small></div></section><div class="grid"><section class="panel"><div class="panel-head"><h3>予算・実績・損益分岐点</h3><div class="legend"><span><i></i>実績</span><span><i class="budget"></i>予算</span><span><i class="be"></i>損益分岐点</span></div></div>'+renderChart(d.months||[])+'</section><section class="panel"><div class="panel-head"><h3>月次利益</h3><div class="meta">中央より右が黒字</div></div>'+profits+'</section></div><section class="panel bottom"><div class="panel-head"><h3>未確定の理由と、次に確認すること</h3><div class="meta">未確定額は利益へ断定反映しません</div></div><div class="table-wrap"><table class="checks"><thead><tr><th>項目・情報源</th><th>状態</th><th>未確定理由</th><th>確認担当</th><th>次の確認</th></tr></thead><tbody>'+checks+'</tbody></table></div><div class="rules">'+rules+'</div><div class="notice">この画面は経営判断用の読み取り専用です。製造数・発注数・スプレッドシート・会計データへ書き込みません。未確定項目が確定した時点で利益を更新します。</div></section>'}
function renderAudit(d){const a=d.expenseAudit;if(!a)return;const items=(a.items||[]).map(v=>'<div class="audit-row"><b>'+safe(v.label)+'</b><span>'+safe(v.type)+'</span><strong>'+yen(v.amount)+'</strong></div>').join('');const pending=(a.unresolved||[]).map(v=>'<div class="pending-row"><b>'+safe(v.label)+'</b><span>'+safe(v.reason)+'</span></div>').join('');const el=document.createElement('section');el.className='panel audit';el.innerHTML='<div class="panel-head"><h3>費用内訳・予算対比の確認根拠</h3><div class="meta">'+safe(a.status)+'</div></div><div class="audit-grid"><div><div class="audit-total">確認済み直接費　<b>'+yen(a.directTotal)+'</b><br><small>銀行・カード引落を重ねず、freee元取引を科目別に集計</small></div>'+items+'</div><div><h3>未確定・配賦待ち</h3>'+pending+'</div></div>';const bottom=document.querySelector('.bottom');bottom.parentNode.insertBefore(el,bottom)}
fetch('/api/management/dorayama',{cache:'no-store'}).then(r=>r.json()).then(d=>{render(d);renderAudit(d)}).catch(()=>{document.getElementById('app').innerHTML='<div class="panel">数字を取得できませんでした。しばらく待ってから更新してください。</div>'})
</script>
</body>
</html>
