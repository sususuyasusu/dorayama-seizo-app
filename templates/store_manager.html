const yenAbs=value=>value==null?'未確定':Math.abs(value/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万円';

function kpi(label,value,detail='',tone=''){return '<div class="kpi '+tone+'"><span>'+safe(label)+'</span><strong>'+value+'</strong><small>'+safe(detail)+'</small></div>'}
function linePoints(rows,key,max,w,h,p){const span=Math.max(rows.length-1,1);return rows.map((row,index)=>Number.isFinite(row[key])?(p+index*(w-p*2)/span)+','+(h-p-row[key]/max*(h-p*2)):null).filter(Boolean).join(' ')}
function trendChart(rows){const w=760,h=260,p=36;const values=rows.flatMap(row=>[row.sales,row.budget,row.breakEven]).filter(Number.isFinite);const max=Math.max(...values,1)*1.08;let grid='';for(let i=0;i<4;i++){const y=p+i*(h-p*2)/3;grid+='<line class="chart-grid" x1="'+p+'" y1="'+y+'" x2="'+(w-p)+'" y2="'+y+'"/><text class="chart-label" x="0" y="'+(y+3)+'">'+Math.round(max*(3-i)/3/10000)+'万</text>'}const span=Math.max(rows.length-1,1);const labels=rows.map((row,index)=>'<text class="chart-label" text-anchor="middle" x="'+(p+index*(w-p*2)/span)+'" y="252">'+safe(row.month)+'</text>').join('');return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="月次の売上、予算、損益分岐点">'+grid+'<polyline class="chart-budget" points="'+linePoints(rows,'budget',max,w,h,p)+'"/><polyline class="chart-be" points="'+linePoints(rows,'breakEven',max,w,h,p)+'"/><polyline class="chart-actual" points="'+linePoints(rows,'sales',max,w,h,p)+'"/>'+labels+'</svg>'}
function salesPaceChart(rows,references,current,channel='total'){
  const latest=String(current.latestDate||rows.at(-1)?.date||'');
  const parts=latest.split('-').map(Number);
  if(parts.length!==3||!parts[0]||!parts[1])return '<section class="panel section-gap"><div class="empty">日別売上の取得後に進捗グラフを表示します</div></section>';
  const year=parts[0],month=parts[1],days=new Date(year,month,0).getDate();
  const config={
    total:{label:'店舗・催事 合計',actual:'sales',target:'targetSales',previous:'previousYearSales',budget:'budget'},
    store:{label:'店舗',actual:'storeSales',target:'storeTargetSales',previous:'storePreviousYearSales',budget:'storeBudget'},
    event:{label:'催事',actual:'eventSales',target:'eventTargetSales',previous:'eventPreviousYearSales',budget:'eventBudget',targetRule:'催事目標は税込22万円 × 催事数 × 開催日数。催事のない日は0円'}
  }[channel];
  const dayOf=value=>Number(String(value||'').split('-')[2]);
  const actualByDay={};rows.forEach(row=>{const day=dayOf(row.date);if(day)actualByDay[day]=Number(row[config.actual]||0)});
  const referenceByDay={};(references||[]).forEach(row=>{const day=dayOf(row.date);if(day)referenceByDay[day]=row});
  const monthBudget=Number(current[config.budget]||0);
  const targetByDay={};let knownTarget=0;
  for(let day=1;day<=days;day++){const value=referenceByDay[day]?.[config.target];if(Number.isFinite(value)){targetByDay[day]=Number(value);knownTarget+=Number(value)}}
  const missingDays=[];for(let day=1;day<=days;day++)if(!Object.prototype.hasOwnProperty.call(targetByDay,day))missingDays.push(day);
  const fallbackTarget=missingDays.length?Math.max(monthBudget-knownTarget,0)/missingDays.length:0;
  missingDays.forEach(day=>targetByDay[day]=fallbackTarget);
  const latestActualDay=Math.max(0,...Object.keys(actualByDay).map(Number));
  const latestReferenceDay=Math.max(0,...Object.keys(referenceByDay).filter(day=>Number.isFinite(referenceByDay[day]?.[config.previous])).map(Number));
  const actualPoints=[],targetPoints=[],previousPoints=[];let actualTotal=0,targetTotal=0,previousTotal=0;
  for(let day=1;day<=days;day++){
    targetTotal+=targetByDay[day]||0;targetPoints.push({day,value:targetTotal});
    if(day<=latestActualDay){actualTotal+=actualByDay[day]||0;actualPoints.push({day,value:actualTotal})}
    if(day<=latestReferenceDay){previousTotal+=Number(referenceByDay[day]?.[config.previous]||0);previousPoints.push({day,value:previousTotal})}
  }
  const w=900,h=280,left=54,right=18,top=18,bottom=48,plotW=w-left-right,baseY=h-bottom;
  const values=[...actualPoints,...targetPoints,...previousPoints].map(point=>point.value);const max=Math.max(...values,1)*1.08;
  const x=day=>left+(day-1)*plotW/Math.max(days-1,1);const y=value=>baseY-value/max*(baseY-top);
  const line=points=>points.map(point=>x(point.day)+','+y(point.value)).join(' ');
  const area=points=>points.length?'M '+x(points[0].day)+' '+baseY+' L '+points.map(point=>x(point.day)+' '+y(point.value)).join(' L ')+' L '+x(points.at(-1).day)+' '+baseY+' Z':'';
  let grid='';for(let i=0;i<4;i++){const gy=top+i*(baseY-top)/3;grid+='<line class="chart-grid" x1="'+left+'" y1="'+gy+'" x2="'+(w-right)+'" y2="'+gy+'"/><text class="chart-label" text-anchor="end" x="'+(left-7)+'" y="'+(gy+3)+'">'+Math.round(max*(3-i)/3/10000)+'万</text>'}
  const weekdays=['日','月','火','水','木','金','土'];let labels='';for(let day=1;day<=days;day++){labels+='<text class="chart-label" text-anchor="middle" x="'+x(day)+'" y="'+(baseY+17)+'">'+day+'</text><text class="chart-label" text-anchor="middle" x="'+x(day)+'" y="'+(baseY+31)+'">'+weekdays[new Date(year,month-1,day).getDay()]+'</text>'}
  const hasActual=actualPoints.length>0;
  const paceTarget=hasActual?(targetPoints[latestActualDay-1]?.value??null):null;
  const targetGap=paceTarget==null?null:actualTotal-paceTarget;
  const achievement=hasActual&&monthBudget?actualTotal/monthBudget*100:null;
  const yoy=previousTotal?actualTotal/previousTotal*100:null;
  const latestPoint=actualPoints.at(-1);
  const latestMarker=latestPoint?'<circle class="pace-latest" cx="'+x(latestPoint.day)+'" cy="'+y(latestPoint.value)+'" r="5"><title>'+latestPoint.day+'日 累積 '+yenAbs(latestPoint.value)+'</title></circle>':'';
  const previousLabel=previousPoints.length?'前年同月':'前年同月（未取得）';
  const sourceNote=previousPoints.length?'前年同月はAirメイトで取得済みの'+latestReferenceDay+'日まで表示':'前年同月は未取得のため、推測値を表示していません';
  const gapLabel=hasActual?(latestActualDay>=days?'月末時点の目標差':latestActualDay+'日時点の目標差'):'実績取得後の目標差';
  return '<section class="panel section-gap"><div class="panel-head"><h3>'+month+'月 '+config.label+'の売上進捗</h3><div class="legend pace-legend"><span><i></i>累積実績</span><span><i class="target"></i>目標累積</span><span><i class="previous"></i>'+previousLabel+'</span></div></div><div class="pace-metrics"><div class="pace-metric"><span>月間売上</span><strong class="'+(hasActual?'':'muted')+'">'+(hasActual?yenAbs(actualTotal):'—')+'</strong></div><div class="pace-metric"><span>'+gapLabel+'</span><strong class="'+(targetGap==null?'muted':targetGap>=0?'positive':'negative')+'">'+yen(targetGap)+'</strong></div><div class="pace-metric"><span>月目標達成率</span><strong class="'+(achievement!=null&&achievement>=100?'positive':'')+'">'+pct(achievement)+'</strong></div><div class="pace-metric"><span>前年同月比</span><strong class="'+(yoy==null?'muted':yoy>=100?'positive':'negative')+'">'+pct(yoy)+'</strong></div></div><svg class="pace-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+month+'月の累積売上、目標累積、前年同月の比較">'+grid+(previousPoints.length?'<path class="pace-previous-area" d="'+area(previousPoints)+'"/><polyline class="pace-previous-line" points="'+line(previousPoints)+'"/>':'')+'<path class="pace-actual-area" d="'+area(actualPoints)+'"/><polyline class="pace-target-line" points="'+line(targetPoints)+'"/><polyline class="pace-actual-line" points="'+line(actualPoints)+'"/>'+latestMarker+labels+'</svg><div class="pace-foot">'+safe(config.targetRule||'目標はAirメイトの日別目標を優先し、未取得の将来日は月目標の残額を日割り表示')+'。'+sourceNote+'。</div></section>'
}

function waterfallSvg(items){if(!items.length)return '';const w=760,h=240,p=30;let running=0;const bars=items.map(it=>{let from,to;if(it.kind==='cost'){from=running;to=running+it.value}else{from=0;to=it.value}running=to;return {...it,from,to}});const vals=bars.flatMap(b=>[b.from,b.to]).concat([0]);const vmin=Math.min(...vals),vmax=Math.max(...vals);const pad=(vmax-vmin)*0.1||1;const lo=vmin-pad,hi=vmax+pad;const y=v=>h-p-((v-lo)/(hi-lo))*(h-p*2);const n=bars.length;const gap=(w-p*2)/n;const bw=gap*0.62;const zeroY=y(0);const zero='<line class="wf-zero" x1="'+p+'" y1="'+zeroY+'" x2="'+(w-p)+'" y2="'+zeroY+'"/>';const conn=bars.slice(0,-1).map((b,i)=>{const x1=p+i*gap+(gap-bw)/2+bw,x2=p+(i+1)*gap+(gap-bw)/2,yv=y(b.to);return '<line class="wf-conn" x1="'+x1+'" y1="'+yv+'" x2="'+x2+'" y2="'+yv+'"/>'}).join('');const bodies=bars.map((b,i)=>{const x=p+i*gap+(gap-bw)/2;const topVal=Math.max(b.from,b.to);const y1=y(topVal),y2=y(Math.min(b.from,b.to));const cls=b.kind==='cost'?'wf-cost':b.kind==='start'?'wf-start':b.kind==='end'?(b.to>=0?'wf-end-pos':'wf-end-neg'):'wf-sub';const valY=topVal>=0?(y1-6):(y2+14);return '<rect class="'+cls+'" x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(2,y2-y1)+'" rx="4"/><text class="wf-val" x="'+(x+bw/2)+'" y="'+valY+'" text-anchor="middle">'+yen(b.value)+'</text><text class="wf-lbl" x="'+(x+bw/2)+'" y="'+(h-8)+'" text-anchor="middle">'+safe(b.label)+'</text>'}).join('');return '<svg class="wf-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="売上から経常利益までの内訳">'+zero+conn+bodies+'</svg>'}

  const selected=rows.find(row=>(row.label||row.month)===state.expenseMonth)||rows.at(-1),selectedLabel=selected.label||selected.month;state.expenseMonth=selectedLabel;
  const month=analysis.months.find(item=>item.label===selectedLabel),totalCost=selected.sales!=null&&selected.profit!=null?selected.sales-selected.profit:null,sourceMeta='<div class="analysis-meta"><span>'+safe(analysis.fileName)+'</span><span>'+safe(analysis.sourceSheet)+'</span><span>Excel更新 '+safe((analysis.updatedAt||'').replace('T',' '))+'</span><span>読み取り専用</span></div>'+goalComparisonPanel(selectedLabel,selected);
  const chartLegend='<div class="legend cost-legend"><span><i class="sales"></i>売上</span><span><i class="labor"></i>内部人件費</span><span><i class="event"></i>催事販売外注</span><span><i class="material"></i>材料・包材原価</span><span><i class="other"></i>その他コスト</span></div>';
  const accountTable=month?'<div class="table-wrap"><table class="data-table expense-account-table"><thead><tr><th>科目</th><th>'+safe(selectedLabel)+'金額</th><th>管理区分</th></tr></thead><tbody>'+expenseAccountRows(analysis,month)+'</tbody></table></div>':'<div class="empty">選択月の科目明細は未取得です</div>';
  const legacyBody=legacyItems.map(row=>'<tr><td>'+safe(row.label)+'</td><td>'+safe(row.kind)+'</td><td>'+yenAbs(row.amount)+'</td></tr>').join('');
  document.getElementById('content').innerHTML=pageHead('COSTS','原価・経費','月ごとに遡り、材料・包材、人件費、催事外注、その他経費を科目まで確認','管理会計PL月次')+sourceMeta+expenseMonthToolbar(rows,selected)+'<div class="kpis">'+kpi(selectedLabel+'材料・包材原価',yenAbs(selected.material),selected.status)+kpi(selectedLabel+'内部人件費',yenAbs(selected.internalLabor),'催事販売外注を除外')+kpi(selectedLabel+'催事販売外注',yenAbs(selected.eventStaffing),'人件費率から除外')+kpi(selectedLabel+'その他コスト',yenAbs(selected.other),'販売管理費等')+'</div><section class="panel expense-result"><div><div class="kicker">MONTHLY PROFIT AFTER COSTS</div><h3>'+safe(selectedLabel)+' 売上から経常利益まで</h3><small>売上 '+yenAbs(selected.sales)+' − 総コスト '+yenAbs(totalCost)+'</small></div><strong class="'+(selected.profit==null?'':selected.profit<0?'negative':'positive')+'">'+yen(selected.profit)+'</strong></section><section class="panel section-gap"><div class="panel-head"><div><h3>'+safe(selectedLabel)+' 原価・経費構成</h3><small>'+safe(selected.status)+'・選択月のみ</small></div>'+chartLegend+'</div>'+costAnalysisChart([selected])+'</section><section class="panel section-gap"><div class="panel-head"><div><h3>'+safe(selectedLabel)+' 科目別原価・経費</h3><small>Excel原本と同じ科目・並び・保存済み金額</small></div><span class="badge '+(selected.status==='確定'?'ok':'pending')+'">'+safe(selected.status)+'</span></div>'+accountTable+'<div class="alert info section-gap">内部人件費は社員・アルバイト・タイミー。催事販売員は「マネキン費（催事販売員の派遣）」として外注費へ分け、内部人件費率には含めません。</div></section><section class="panel section-gap"><div class="panel-head"><h3>月別の原価・経費・経常利益</h3><small>月名を押すと上の表示も切り替わります</small></div><div class="table-wrap"><table class="data-table expense-history-table"><thead><tr><th>月・状態</th><th>材料・包材</th><th>内部人件費</th><th>催事販売外注</th><th>その他コスト</th><th>総コスト</th><th>経常利益</th></tr></thead><tbody>'+expenseHistoryRows(rows,selectedLabel)+'</tbody></table></div></section><details class="all-months-details section-gap"><summary>従来の7月確定費用明細を開く</summary><div class="table-wrap"><table class="data-table"><thead><tr><th>項目</th><th>区分</th><th>7月金額</th></tr></thead><tbody>'+legacyBody+'</tbody></table></div></details>'+expenseAuditDetails()+'<div class="alert danger section-gap">8月は進行中で、減価償却3期分、社宅家賃の給与控除、催事売上差は未確定です。TakeEatsは第9期以降の消込済みを検証済み（8/28）。空欄は0円として扱いません。</div>';
  document.getElementById('expense-month-select').onchange=event=>setExpenseMonth(event.target.value);document.querySelectorAll('[data-expense-month]').forEach(button=>button.onclick=()=>setExpenseMonth(button.dataset.expenseMonth))

function renderFixed(){const d=state.data.fixed||{},methods=d.paymentMethods||[],details=d.details||[],goal=currentGoal(),allowance=goal?goal.totalTarget-goal.materialTarget-goal.laborTarget-goal.ordinaryProfitTarget:null;const body=details.map(row=>'<tr><td>'+safe(row.category)+'</td><td>'+yenAbs(row.amount)+'</td><td>'+safe(row.vendor)+'</td><td>'+safe(row.payment)+'</td><td><span class="badge pending">'+safe(row.evidence||'未確認')+'</span></td><td>'+safe(row.source)+'</td></tr>').join('');document.getElementById('content').innerHTML=pageHead('FIXED & PAYMENT','固定費・支払','freee、銀行、カード、現金を重ねず証憑と突合','未突合 '+number(d.evidencePendingCount)+'件')+'<div class="kpis">'+kpi('固定費候補',yenAbs(d.referenceTotal),'確定値ではありません')+kpi('設定上の未配分枠',yenAbs(allowance),'催事外注・固定費・その他経費')+kpi('支払経費参照',yenAbs(d.paymentExpenseReference),'重複・配賦確認前')+kpi('証憑未突合',number(d.evidencePendingCount)+'件','明細確認が必要','bad')+'</div><div class="alert info">未配分枠は、設定売上目標から原価目標・内部人件費目標・経常利益目標を引いた上限目安です。固定費の確定額ではありません。</div><div class="alert danger">銀行引落とカード利用を単純合算しません。freee元取引と対応した支払グループだけを1回計上します。</div><div class="grid-2 section-gap"><section class="panel"><div class="panel-head"><h3>支払方法別</h3><small>8月参照</small></div>'+(methods.length?barList(methods):'<div class="empty">支払方法別は取得待ちです</div>')+'</section><section class="panel"><div class="panel-head"><h3>固定費候補明細</h3><small>確定前</small></div><div class="table-wrap"><table class="data-table"><thead><tr><th>科目</th><th>金額</th><th>支払先</th><th>支払方法</th><th>証憑</th><th>連携元</th></tr></thead><tbody>'+body+'</tbody></table></div></section></div>'}
function renderReference(tab,sheet){document.getElementById('content').innerHTML=pageHead('EXCEL REFERENCE',state.data.navigation.find(item=>item.id===tab)?.label||sheet,'Excel原本の内容を削除せず表示。旧様式は現在の確定数字へ混ぜません',sheet)+'<div id="reference-sheet"><div class="panel empty">Excel原本を読み込み中…</div></div>';loadSheet(sheet,'reference-sheet')}
function renderWorkbook(){const catalog=state.data.workbook.catalog;const options=catalog.map(item=>'<option value="'+safe(item.name)+'">'+safe(item.name)+'｜'+safe(item.quality)+'</option>').join('');document.getElementById('content').innerHTML=pageHead('SOURCE WORKBOOK','Excel原本','15シートをそのまま閲覧。確定実績・予算参考・旧様式参考を分離',state.data.workbook.sheetCount+'シート')+'<section class="panel"><div class="workbook-toolbar"><select id="sheet-select">'+options+'</select><span class="workbook-meta">原本は変更しません</span></div><div id="workbook-sheet"><div class="empty">シートを読み込み中…</div></div></section>';const select=document.getElementById('sheet-select');select.onchange=()=>loadSheet(select.value,'workbook-sheet');loadSheet(select.value,'workbook-sheet')}
function columnName(number){let value='',current=number;while(current>0){current--;value=String.fromCharCode(65+current%26)+value;current=Math.floor(current/26)}return value}
async function loadSheet(name,targetId){const target=document.getElementById(targetId);try{let data=state.sheetCache[name];if(!data){const response=await fetch('/api/management/workbook?sheet='+encodeURIComponent(name),{cache:'no-store'});if(!response.ok)throw new Error('sheet');data=await response.json();state.sheetCache[name]=data}const headers=Array.from({length:data.maxColumn},(_,index)=>'<th>'+columnName(index+1)+'</th>').join('');const rows=data.rows.map(row=>{const cells={};row.cells.forEach(cell=>cells[cell.column]=cell);let content='';for(let column=1;column<=data.maxColumn;column++){const cell=cells[column];content+='<td class="'+(cell?.kind==='error'?'cell-error ':'')+(cell?.hasFormula?'formula':'')+'">'+safe(cell?.value??'')+'</td>'}return '<tr><td class="row-number">'+row.row+'</td>'+content+'</tr>'}).join('');target.innerHTML='<div class="alert '+(data.quality==='2026確定・原本'?'info':'')+'">'+safe(data.warning)+'</div><div class="quality-strip"><span class="quality-chip '+(data.quality==='2026確定・原本'?'good':'warn')+'">'+safe(data.quality)+'</span><span class="quality-chip">'+data.maxRow+'行 × '+data.maxColumn+'列</span><span class="quality-chip">数式 '+data.formulaCount+'セル</span><span class="quality-chip '+(data.errorCount?'warn':'good')+'">原本エラー '+data.errorCount+'セル</span></div><div class="sheet-wrap"><table class="sheet-table"><thead><tr><th class="row-number">行</th>'+headers+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}catch(error){target.innerHTML='<div class="panel empty">Excel原本を取得できませんでした</div>'}}
async function start(){try{const response=await fetch('/api/management/analysis',{cache:'no-store'});if(!response.ok)throw new Error('analysis');state.data=await response.json();state.goalDraft=null;applyGoalSettingsAcrossState(ensureGoalDraft());renderNavigation();const rates=goalRates();document.getElementById('top-status').textContent='目標反映中・原価'+pct(rates.material)+'・人件費'+pct(rates.labor)+'・利益'+pct(rates.ordinaryProfit);renderCurrent()}catch(error){document.getElementById('content').innerHTML='<div class="panel empty">経営データを取得できませんでした。時間をおいて更新してください。</div>';document.getElementById('top-status').textContent='取得待ち'}}
start();
